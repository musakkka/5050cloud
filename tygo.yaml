# tygo turns pkg/api into web/src/api/types.gen.ts. Run `make gen-ts`.
packages:
  - path: "github.com/musakkka/5050cloud/pkg/api"
    output_path: "web/src/api/types.gen.ts"
    # routes.go is the Go route table (interface{} values); the mocks
    # generator reads it instead.
    exclude_files:
      - "routes.go"
    fallback_type: unknown
    type_mappings:
      any: "unknown"
    frontmatter: |
      // SPDX-License-Identifier: AGPL-3.0-only
      // Code generated by tygo from pkg/api (docs/SPEC.md section 11). DO NOT EDIT.
      // Run `make gen-ts` after changing pkg/api.
