    .edge { display: none }
    @media (prefers-color-scheme: dark) { .edge { display: inline } }
  </style>
  <rect width="32" height="16" fill="#f5c400"/>
  <rect y="16" width="32" height="16" fill="#141414"/>
  <rect class="edge" x="0.5" y="16.5" width="31" height="15" fill="none" stroke="#f5c400"/>
  <g fill="none" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <g stroke="#141414">
      <path d="M14 4H7V8H11A2 2 0 0 1 11 12H6"/>
      <rect x="19" y="4" width="6" height="8" rx="3"/>
    </g>
    <g stroke="#f5c400" transform="translate(0 16)">
      <path d="M14 4H7V8H11A2 2 0 0 1 11 12H6"/>
      <rect x="19" y="4" width="6" height="8" rx="3"/>
    </g>
  </g>
</svg>
