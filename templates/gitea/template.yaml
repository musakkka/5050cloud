# SPDX-License-Identifier: MIT
id: gitea
name: Gitea
tagline: Lightweight Git hosting with issues and pull requests, backed by Postgres.
description: >-
  Gitea with repositories on a volume and metadata in Postgres. The first
  account you register becomes the administrator. SSH is off; clone over
  HTTPS.
docs: https://5050cloud.com/docs/templates/gitea
icon: gitea.svg
category: app
inputs:
  - name: GITEA__security__SECRET_KEY
    label: Secret key
    description: Encrypts secrets Gitea stores, such as two-factor keys.
    generate: secret(32)
    required: true
    secret: true
services:
  - name: Postgres
    data: postgres
    images:
      "17": postgres:17.10-bookworm
      "18": postgres:18.4-bookworm
    config:
      name: Postgres
      icon: postgres
      kind: database
      template: postgres
      templateVersion: "17"
      source:
        type: image
        image: postgres:17.10-bookworm
      deploy:
        startCommand: postgres -c config_file=/etc/postgresql/5050.conf
        restartPolicy: always
        replicas: 1
        singleton: true
        memoryReservationMb: 512
        shmSizeMb: 256
        placement:
          roles: [data]
      networking:
        port: 5432
        privateName: postgres
    variables:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{secret(32)}}
      POSTGRES_DB: railway
      PGUSER: ${{POSTGRES_USER}}
      PGPASSWORD: ${{POSTGRES_PASSWORD}}
      PGDATABASE: ${{POSTGRES_DB}}
      PGHOST: ${{FIFTY_PRIVATE_DOMAIN}}
      PGPORT: "5432"
      PGDATA: /var/lib/postgresql/data/pgdata
      DATABASE_URL: postgresql://${{PGUSER}}:${{PGPASSWORD}}@${{FIFTY_PRIVATE_DOMAIN}}:5432/${{PGDATABASE}}
      DATABASE_PUBLIC_URL: postgresql://${{PGUSER}}:${{PGPASSWORD}}@${{FIFTY_TCP_PROXY_DOMAIN}}:${{FIFTY_TCP_PROXY_PORT}}/${{PGDATABASE}}
    volume:
      mountPath: /var/lib/postgresql/data
    files:
      - path: /etc/postgresql/5050.conf
        template: postgres/postgresql.conf.tmpl
        mode: 420
      - path: /docker-entrypoint-initdb.d/5050-init.sql
        template: postgres/init.sql
        mode: 420
      - path: /opt/5050/bin/archive-wal
        template: postgres/archive-wal.sh
        mode: 493
      - path: /opt/5050/bin/backup-postgres
        template: postgres/backup-postgres.sh
        mode: 493
      - path: /opt/5050/bin/restore-postgres
        template: postgres/restore-postgres.sh
        mode: 493
      - path: /opt/5050/bin/pg-metrics
        template: postgres/pg-metrics.sh
        mode: 493
      - path: /opt/5050/bin/check-archiving
        template: postgres/check-archiving.sh
        mode: 493
    tools: [wal-g]
    backup:
      kind: postgres_wal
      runIn: service
      backup: [/opt/5050/bin/backup-postgres]
      restore: [/opt/5050/bin/restore-postgres]
      retention: [/opt/5050/bin/wal-g, delete, retain, FULL, "{{.RetainDays}}", --confirm]
      verify: [/opt/5050/bin/check-archiving]
      continuous: true
      # Dump and Load run in one job, piped together, for Upgrade to a new
      # major version (SOURCE_HOST and TARGET_HOST are the private names).
      dump: [sh, -c, 'exec pg_dumpall -h "$SOURCE_HOST" -U "$POSTGRES_USER"']
      load: [sh, -c, 'exec psql -X -q -h "$TARGET_HOST" -U "$POSTGRES_USER" -d postgres']
    probe:
      health: [pg_isready, -q, -h, 127.0.0.1, -p, "5432"]
      metrics: [/opt/5050/bin/pg-metrics]
      check: [psql, -X, -At, -c, SELECT count(*) FROM pg_class]
    monitors:
      - metric: disk
        threshold: 80
        forMinutes: 5
  - name: Gitea
    dependsOn: [Postgres]
    domain: true
    config:
      name: Gitea
      icon: gitea
      kind: web
      template: gitea
      source:
        type: image
        image: gitea/gitea:1.27.3
      deploy:
        healthcheckPath: /api/healthz
        singleton: true
      networking:
        port: 3000
    variables:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: ${{Postgres.PGHOST}}:${{Postgres.PGPORT}}
      GITEA__database__NAME: ${{Postgres.PGDATABASE}}
      GITEA__database__USER: ${{Postgres.PGUSER}}
      GITEA__database__PASSWD: ${{Postgres.PGPASSWORD}}
      GITEA__security__SECRET_KEY: ${{input.GITEA__security__SECRET_KEY}}
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: ${{FIFTY_PUBLIC_DOMAIN}}
      GITEA__server__ROOT_URL: https://${{FIFTY_PUBLIC_DOMAIN}}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DISABLE_SSH: "true"
    volume:
      mountPath: /data
    backup:
      kind: volume
      runIn: job
      backup: [/opt/5050/bin/backup-volume]
      restore: [/opt/5050/bin/restore-volume]
      retention: [/opt/5050/bin/retention-restic]
