# SPDX-License-Identifier: MIT
id: n8n
name: n8n
tagline: Workflow automation you host yourself, backed by Postgres.
description: >-
  n8n with its own Postgres. Workflows, credentials and executions live in the
  database; N8N_ENCRYPTION_KEY protects stored credentials, so keep it safe.
docs: https://5050cloud.com/docs/templates/n8n
icon: n8n.svg
category: app
inputs:
  - name: N8N_ENCRYPTION_KEY
    label: Encryption key
    description: Encrypts the credentials n8n stores. Changing it later makes them unreadable.
    generate: secret(32)
    required: true
    secret: true
services:
  - name: Postgres
    data: postgres
    images:
      "17": postgres:17.10-bookworm
      "18": postgres:18.4-bookworm
    config:
      name: Postgres
      icon: postgres
      kind: database
      template: postgres
      templateVersion: "17"
      source:
        type: image
        image: postgres:17.10-bookworm
      deploy:
        startCommand: postgres -c config_file=/etc/postgresql/5050.conf
        restartPolicy: always
        replicas: 1
        singleton: true
        memoryReservationMb: 512
        shmSizeMb: 256
        placement:
          roles: [data]
      networking:
        port: 5432
        privateName: postgres
    variables:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{secret(32)}}
      POSTGRES_DB: railway
      PGUSER: ${{POSTGRES_USER}}
      PGPASSWORD: ${{POSTGRES_PASSWORD}}
      PGDATABASE: ${{POSTGRES_DB}}
      PGHOST: ${{FIFTY_PRIVATE_DOMAIN}}
      PGPORT: "5432"
      PGDATA: /var/lib/postgresql/data/pgdata
      DATABASE_URL: postgresql://${{PGUSER}}:${{PGPASSWORD}}@${{FIFTY_PRIVATE_DOMAIN}}:5432/${{PGDATABASE}}
      DATABASE_PUBLIC_URL: postgresql://${{PGUSER}}:${{PGPASSWORD}}@${{FIFTY_TCP_PROXY_DOMAIN}}:${{FIFTY_TCP_PROXY_PORT}}/${{PGDATABASE}}
    volume:
      mountPath: /var/lib/postgresql/data
    files:
      - path: /etc/postgresql/5050.conf
        template: postgres/postgresql.conf.tmpl
        mode: 420
      - path: /docker-entrypoint-initdb.d/5050-init.sql
        template: postgres/init.sql
        mode: 420
      - path: /opt/5050/bin/archive-wal
        template: postgres/archive-wal.sh
        mode: 493
      - path: /opt/5050/bin/backup-postgres
        template: postgres/backup-postgres.sh
        mode: 493
      - path: /opt/5050/bin/restore-postgres
        template: postgres/restore-postgres.sh
        mode: 493
      - path: /opt/5050/bin/pg-metrics
        template: postgres/pg-metrics.sh
        mode: 493
      - path: /opt/5050/bin/check-archiving
        template: postgres/check-archiving.sh
        mode: 493
    tools: [wal-g]
    backup:
      kind: postgres_wal
      runIn: service
      backup: [/opt/5050/bin/backup-postgres]
      restore: [/opt/5050/bin/restore-postgres]
      retention: [/opt/5050/bin/wal-g, delete, retain, FULL, "{{.RetainDays}}", --confirm]
      verify: [/opt/5050/bin/check-archiving]
      continuous: true
      # Dump and Load run in one job, piped together, for Upgrade to a new
      # major version (SOURCE_HOST and TARGET_HOST are the private names).
      dump: [sh, -c, 'exec pg_dumpall -h "$SOURCE_HOST" -U "$POSTGRES_USER"']
      load: [sh, -c, 'exec psql -X -q -h "$TARGET_HOST" -U "$POSTGRES_USER" -d postgres']
    probe:
      health: [pg_isready, -q, -h, 127.0.0.1, -p, "5432"]
      metrics: [/opt/5050/bin/pg-metrics]
      check: [psql, -X, -At, -c, SELECT count(*) FROM pg_class]
    monitors:
      - metric: disk
        threshold: 80
        forMinutes: 5
  - name: n8n
    dependsOn: [Postgres]
    domain: true
    config:
      name: n8n
      icon: n8n
      kind: web
      template: n8n
      source:
        type: image
        image: n8nio/n8n:2.42.4
      deploy:
        healthcheckPath: /healthz
        runAsUser: "0"
        memoryReservationMb: 512
      networking:
        port: 5678
    variables:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${{Postgres.PGHOST}}
      DB_POSTGRESDB_PORT: ${{Postgres.PGPORT}}
      DB_POSTGRESDB_DATABASE: ${{Postgres.PGDATABASE}}
      DB_POSTGRESDB_USER: ${{Postgres.PGUSER}}
      DB_POSTGRESDB_PASSWORD: ${{Postgres.PGPASSWORD}}
      N8N_ENCRYPTION_KEY: ${{input.N8N_ENCRYPTION_KEY}}
      N8N_HOST: ${{FIFTY_PUBLIC_DOMAIN}}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://${{FIFTY_PUBLIC_DOMAIN}}/
      GENERIC_TIMEZONE: UTC
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volume:
      mountPath: /home/node/.n8n
